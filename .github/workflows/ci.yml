# CI — see docs/adr/0010-ai-agent-commit-guard.md for how this relates to
# the local lefthook enforcement. Local hooks catch problems before push;
# this catches anything bypassed locally (--no-verify is always possible).
#
# Split into a fast job (lint/format/typecheck, no DB needed) and a slower
# job (test/build/audit, needs Postgres) so a lint failure reports in
# under a minute instead of waiting on the full suite — see the phased
# adoption note in docs/adr/0009-security-hardening-p0.md: this workflow
# only enforces what the codebase can currently pass (oxlint's baseline is
# warnings-only for now on pre-existing `any`/`console` usage; see
# docs/adr/0004 and docs/adr/0013 for the ratchet this will tighten into).
#
# The redis service (and REDIS_URL below) is required even though this job
# only builds and tests, not deploys: `next build` always forces
# NODE_ENV=production internally regardless of the NODE_ENV env var passed
# in, and src/lib/env.ts refuses to boot in production without REDIS_URL
# set (docs/adr/0003-single-rate-limiter.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

  heavy:
    name: Test, migration check, build, audit
    runs-on: ubuntu-latest
    needs: fast
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuvia
          POSTGRES_PASSWORD: nuvia
          POSTGRES_DB: nuvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nuvia:nuvia@localhost:5432/nuvia
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use-0000000000
      APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx drizzle-kit push --force
      - run: bun test
      - run: bunx drizzle-kit check
      - run: bun run build
      - run: bun audit --prod
        continue-on-error: true # see docs/supply-chain.md — triage by reachability, not a hard gate yet
