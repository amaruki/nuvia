# CI — see docs/adr/0010-ai-agent-commit-guard.md for how this relates to
# the local lefthook enforcement. Local hooks catch problems before push;
# this catches anything bypassed locally (--no-verify is always possible).
#
# Split into a fast job (lint/format/typecheck, no DB needed), a slower job
# (test/build/audit, needs Postgres), and a browser job (Playwright-driven
# WCAG 2.2 AA accessibility gate plus the production route-boot smoke) so a
# lint failure reports in under a minute instead of waiting on the full
# suite — see the phased adoption note in docs/adr/0009-security-hardening-p0.md.
# This workflow only enforces what the codebase can currently pass (oxlint's
# warnings-only for now on pre-existing `any`/`console` usage; see
# docs/adr/0004 and docs/adr/0013 for the ratchet this will tighten into).
#
# The redis service (and REDIS_URL below) is required even though this job
# only builds and tests, not deploys: `next build` always forces
# NODE_ENV=production internally regardless of the NODE_ENV env var passed
# in, and src/lib/env.ts refuses to boot in production without REDIS_URL
# set (docs/adr/0003-single-rate-limiter.md).

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege (issue #11): CI only reads the repo, runs checks, and
# uploads failure artifacts. Job-level blocks may narrow further; nothing
# here needs write access. Matches the supply-chain policy in
# docs/supply-chain.md.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0 (v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0 (v2)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

  heavy:
    name: Test, migration check, build, audit
    runs-on: ubuntu-latest
    needs: fast
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuvia
          POSTGRES_PASSWORD: nuvia
          POSTGRES_DB: nuvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nuvia:nuvia@localhost:5432/nuvia
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use-0000000000
      APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      # actions/checkout v4.4.0 (v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0 (v2)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
      - run: bunx drizzle-kit check
      - run: bun run build
      - run: bun audit --prod
        continue-on-error: true # see docs/supply-chain.md — triage by reachability, not a hard gate yet

  browser:
    # Playwright gates that cannot run under `bun test`: the axe-core WCAG
    # 2.2 AA audit over a real signed-in browser session (light + dark), and
    # the production route-boot smoke against `next start`. The a11y gate is
    # self-contained (it raises its own compose stack on the runner); the
    # route smoke and the production build need the service containers below
    # (session-aware pages like /forums are force-dynamic now, but the
    # service containers keep the build environment identical to the heavy
    # job's runner).
    #
    # No `playwright install` step: the gate drives the Chrome build that
    # ships preinstalled on GitHub-hosted ubuntu runners (channel: "chrome"
    # in scripts/a11y-smoke/main.ts). Downloading a Playwright-managed
    # browser added minutes of network work and was implicated in the
    # runner-starvation aborts of runs 31930748760 and 31934735821.
    name: Playwright a11y gate + route smoke
    runs-on: ubuntu-latest
    needs: fast
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuvia
          POSTGRES_PASSWORD: nuvia
          POSTGRES_DB: nuvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nuvia:nuvia@localhost:5432/nuvia
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use-0000000000
      APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      # actions/checkout v4.4.0 (v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2.2.0 (v2)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Build first: the a11y gate audits the production build via
      # `next start` (see scripts/a11y-smoke/server.ts), which is cheaper
      # on the runner than JIT-compiling 94 page loads under `next dev`.
      - name: Production build
        run: bun run build
      - name: Apply database migrations
        run: bun run db:migrate
      - name: WCAG 2.2 AA smoke (axe via Playwright, light + dark)
        run: bun run test:a11y
      - name: Route boot smoke (next start)
        run: bun run test:smoke
      - name: Upload a11y audit artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a11y-smoke-results
          path: |
            /tmp/nuvia-a11y-smoke-*/summary.json
            /tmp/nuvia-a11y-smoke-*/next-dev.log
            /tmp/nuvia-a11y-smoke-*/next-start.log
          if-no-files-found: ignore

  docker:
    # The production image is a deploy artifact like any other code path —
    # if it stops building or stops booting, that must fail CI, not surface
    # at the next real deploy. Builds the Dockerfile (needs no database:
    # the public DB-backed pages are force-dynamic), boots it against real
    # Postgres + Redis, and asserts the two deploy-critical behaviors:
    # migrations apply at container start, and /api/v1/health answers 200.
    name: Docker image build + boot + health probe
    runs-on: ubuntu-latest
    needs: fast
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuvia
          POSTGRES_PASSWORD: nuvia
          POSTGRES_DB: nuvia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nuvia:nuvia@localhost:5432/nuvia
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use-0000000000
      APP_URL: http://localhost:3000
    steps:
      # actions/checkout v4.4.0 (v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the production image
        run: docker build --tag nuvia:ci .
      - name: Boot the container (migrations apply on start)
        run: |
          docker run --detach --name nuvia \
            --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            --env REDIS_URL="$REDIS_URL" \
            --env BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            --env APP_URL="$APP_URL" \
            --env NODE_ENV=production \
            nuvia:ci
      - name: Wait for the health probe
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              echo
              exit 0
            fi
            sleep 2
          done
          echo "health probe never became healthy; container logs follow"
          docker logs nuvia
          exit 1
      - name: Assert the probe body reports both dependencies reachable
        run: |
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"database":{"reachable":true}' /tmp/health.json
          grep -q '"redis":{"reachable":true}' /tmp/health.json
      - name: Container logs on failure
        if: failure()
        run: docker logs nuvia
