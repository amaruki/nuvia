# Local git hooks — the enforcement layer for docs/adr/0010-ai-agent-commit-guard.md.
# Applies identically to human and AI-agent commits: nothing bypasses these
# checks by running fast. Installed automatically by `bun install` (see
# package.json's `prepare` script) — no separate setup step for contributors.

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      run: bunx oxlint {staged_files}
    - name: format
      glob: "*.{js,jsx,ts,tsx,json,css,md}"
      run: bunx oxfmt --check {staged_files}

commit-msg:
  jobs:
    - name: conventional-commit
      run: bunx commitlint --edit {1}
    - name: no-ai-coauthor-trailer
      # Conventional Commits + this repo's convention: no Co-Authored-By
      # trailers, human or AI. See CONTRIBUTING.md.
      run: '! grep -qi "^co-authored-by:" {1}'

pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: test
      # Infra-free unit suite (~10s, no docker). The integration suite needs
      # the compose stack and runs in CI; see docs/adr/0010.
      run: bun run test:unit
    - name: secret-scan
      # Issue #5: gitleaks over the full local history. CI runs the same gate
      # with a fixture that proves it fires; locally the scan alone is enough.
      # Needs the gitleaks binary (see scripts/secret-scan.ts header).
      run: bun run scan:secrets
